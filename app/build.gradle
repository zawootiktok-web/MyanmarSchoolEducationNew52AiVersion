plugins {
    //alias(libs.plugins.android.application)
    id 'com.android.application'
}

android {
    namespace 'com.mmschooledu'
    compileSdk 36

    defaultConfig {
        applicationId "com.mmschooledu"
        minSdk 23
        targetSdk 36
        versionCode 152
        versionName "1.1.52"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            ndk {
                abiFilters 'arm64-v8a'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // These legacy layouts contain intentional repeated IDs/relative references; keep other lint checks active.
    lint {
        disable 'DuplicateIds', 'NotSibling', 'UnknownId'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.jsoup
    implementation libs.play.services.ads
    implementation libs.exoplayer
    implementation libs.user.messaging.platform
    implementation libs.gridlayout
    implementation libs.volley
    implementation libs.exoplayer.ui
    implementation libs.glide
    implementation libs.libvlc.all
    implementation libs.android.joda
    implementation files('libs/core-0.9.0.2.aar')
//    implementation libs.recyclerview
    implementation libs.swiperefreshlayout
    implementation libs.androidx.recyclerview
    implementation libs.startapp.inapp.sdk
    implementation libs.audience.network.sdk
    implementation libs.recyclerview.fastscroll
    implementation libs.androidx.lifecycle.extensions
    implementation libs.androidx.core
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.androidx.lifecycle.process
    implementation libs.circleimageview
    implementation libs.androidx.viewpager2
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation files('libs/tedpermission-2.2.2.aar')
    implementation project(':xgetter')
    implementation project(':quickadmob')
    implementation project(':youtubeExtractor')
    implementation project(path: ':librarynew')

    implementation libs.retrofit
    implementation libs.converter.scalars
    implementation libs.converter.gson

    implementation libs.myanmar.tools
}